    <body>
        <div id="content-container"></div>
        <script>
            fetch('/ats/documents/b5279857-cf81-4dde-a215-fc48957ee2b5/careerportal/18096d20247d4ecfa4efcf04875cbda6.html')
                .then(response => response.text())
                .then(data => {
                    var parser = new DOMParser();
                    var htmlDoc = parser.parseFromString(data, 'text/html');
                    var bodyContent = htmlDoc.body.innerHTML;
                    document.getElementById('content-container').innerHTML = bodyContent;

                    htmlDoc.head.childNodes.forEach(node => {
                        if (node.tagName === 'SCRIPT') {
                            var script = document.createElement('script');
                            script.innerHTML = node.innerHTML; // Set the script content

                            for (var i = 0; i < node.attributes.length; i++) {
                                script.setAttribute(node.attributes[i].name, node.attributes[i].value);
                            }

                            document.head.appendChild(script);
                        } else {
                            document.head.appendChild(node.cloneNode(true));
                        }
                    });
                });
        </script>
    </body>
